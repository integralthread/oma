# Oma — toolchain and environment.
# Erlang/Elixir are pinned to match the other ex/* repositories in arca.

# The Omarchy built-ins are fetched file by file by `mix oma.sync` (see
# Oma.Omarchy); no checkout is needed. `mix oma.sync --omarchy DIR` reads a
# local clone instead, for offline work.

[tools]
erlang = "29.0.6"
elixir = "1.20.4-otp-29"

[env]
MIX_ENV = "{{ env.MIX_ENV | default(value='dev') }}"
