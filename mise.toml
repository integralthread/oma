# Oma — toolchain and environment.
# Erlang/Elixir are pinned to match the other ex/* repositories in arca.

# Upstream Omarchy checkout; its themes/*/colors.toml files are the source of
# truth for generated themes. Cloned by `mise bootstrap repos` into ./omarchy/.
[bootstrap.repos]
omarchy = { url = "git@github.com:omacom/omarchy.git" }

[tools]
erlang = "29.0.6"
elixir = "1.20.4-otp-29"

[env]
MIX_ENV = "{{ env.MIX_ENV | default(value='dev') }}"
